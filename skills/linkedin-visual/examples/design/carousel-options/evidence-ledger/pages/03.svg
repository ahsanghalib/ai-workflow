  </g><text id="p03-heading" x="88" y="282" font-family="DM Sans" font-size="64px" font-weight="700" fill="#16181D" text-anchor="start" letter-spacing="0px" opacity="1">Freshness is a retrieval feature.</text><line id="p03-heading-rule" x1="88" y1="326" x2="992" y2="326" stroke="#D9DAD4" stroke-width="2" opacity="1"/><text id="p03-label-1" x="88" y="430" font-family="JetBrains Mono" font-size="18px" font-weight="700" fill="#2540D9" text-anchor="start" letter-spacing="1.2px" opacity="1">CONCEPT</text><text id="p03-detail-1" x="300" y="430" font-family="DM Sans" font-size="28px" font-weight="400" fill="#16181D" text-anchor="start" letter-spacing="0px" opacity="1"><tspan x="300" dy="0">An index is part of the product.</tspan><tspan x="300" dy="35.84">Stale documents become stale answers.</tspan></text><line id="p03-row-1" x1="88" y1="498" x2="992" y2="498" stroke="#D9DAD4" stroke-width="2" opacity="1"/><text id="p03-label-2" x="88" y="604" font-family="JetBrains Mono" font-size="18px" font-weight="700" fill="#2540D9" text-anchor="start" letter-spacing="1.2px" opacity="1">MECHANISM</text><text id="p03-detail-2" x="300" y="604" font-family="DM Sans" font-size="28px" font-weight="400" fill="#16181D" text-anchor="start" letter-spacing="0px" opacity="1"><tspan x="300" dy="0">Track document age and index version.</tspan><tspan x="300" dy="35.84">Refresh on a known schedule.</tspan></text><line id="p03-row-2" x1="88" y1="672" x2="992" y2="672" stroke="#D9DAD4" stroke-width="2" opacity="1"/><text id="p03-label-3" x="88" y="778" font-family="JetBrains Mono" font-size="18px" font-weight="700" fill="#2540D9" text-anchor="start" letter-spacing="1.2px" opacity="1">TAKEAWAY</text><text id="p03-detail-3" x="300" y="778" font-family="DM Sans" font-size="28px" font-weight="700" fill="#16181D" text-anchor="start" letter-spacing="0px" opacity="1"><tspan x="300" dy="0">Measure freshness before tuning</tspan><tspan x="300" dy="35.84">the prompt or swapping the model.</tspan></text>
