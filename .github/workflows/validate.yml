name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skills
        run: bash validate-skills.sh

      - name: Check shell syntax
        run: bash -n script.sh bin/* skills/project-init/scripts/*.sh skills/project-init/tests/*.sh skills/spec-workflow/tests/*.sh

      - name: Test project-init helpers and contracts
        run: bash skills/project-init/tests/test-project-init.sh

      - name: Test SPEC workflow contract
        run: bash skills/spec-workflow/tests/test-contract.sh

      - name: Test cross-skill SPEC workflow contract
        run: bash skills/spec-workflow/tests/test-cross-skill-contract.sh

      - name: Parse Codex configuration
        run: python3 -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("codex/config.toml").read_text())'
